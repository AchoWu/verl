hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  # 2x over-sampling: DAPO's filter drops zero-variance groups, so generate twice the prompts
  # and train on the first `train_batch_size` finished groups. These two must be set together
  # -- gen_batch_size does NOT track train_batch_size automatically. run_justrl2_16k.sh passes
  # both (8 and 16); the values here only matter if you use this config directly.
  train_batch_size: 8
  gen_batch_size: 16

reward:
  reward_manager:
    name: dapo
  # DAPO soft overlong punishment. `exclude_from_critic` is the JustRL-II addition: the reward
  # manager then also emits the pre-penalty score, which becomes the critic's regression target
  # while the actor keeps using the shaped reward.
  reward_kwargs:
    overlong_buffer_cfg:
      enable: False
      len: 0
      penalty_factor: 0.0
      log: False
      exclude_from_critic: False
    max_resp_len: null

algorithm:
  # JustRL-II: length-adaptive advantages (lambda_i = k ** (1 / L_i)), lambda=1 critic targets.
  adv_estimator: gae_length_adaptive
  # gamma MUST stay 1.0: the decoupled returns are the suffix reward sum, which only equals the
  # unbiased lambda=1 return when undiscounted. The estimator asserts this.
  gamma: 1.0
  gae_lambda_k: 0.5
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False
    metric: null
    max_num_gen_batches: 0

critic:
  enable: True

trainer:
  project_name: verl-justrl2
