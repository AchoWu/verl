tools:
  - class_name: "recipe.manju_tag.collection_tool.GetCollectionInfoTool"
    config:
      type: native
      # Written by prepare_data.py. Read by every AgentLoopWorker, so it must exist on each node.
      collections_path: "~/data/manju_tag/collections.jsonl"
      # Same cut as the single-turn data. The tool's reply then stays under ~4300 chars, so keep
      # multi_turn.max_tool_response_length (also in chars) above that or the script gets cut again.
      max_script_chars: 4000
    tool_schema:
      type: "function"
      function:
        name: "get_collection_info"
        description: "根据 collection_rowkey 获取漫剧合集的标题、分类、剧情背景和剧本。漫剧内容不在对话中，打标签前必须先调用。"
        parameters:
          type: "object"
          properties:
            collection_rowkey:
              type: "string"
              description: "漫剧合集的 collection_rowkey，原样使用用户消息中给出的值。"
          required: ["collection_rowkey"]
